<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Eats AI, Continue in the app</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green: #5AA02E;
      --green-deep: #3f7a1f;
      --gold: #F4B63E;
      --ink: #1c2413;
      --muted: #5c6653;
      --surface: #ffffff;
      --bg: #f6f8f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(120% 80% at 50% 0%, #eef5e3 0%, var(--bg) 60%);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: var(--surface);
      width: 100%;
      max-width: 420px;
      border-radius: 28px;
      padding: 40px 32px 36px;
      text-align: center;
      box-shadow: 0 24px 60px -20px rgba(63, 122, 31, 0.35), 0 2px 8px rgba(28, 36, 19, 0.06);
      border: 1px solid rgba(90, 160, 46, 0.12);
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      margin: 0 auto 22px;
      display: block;
      box-shadow: 0 8px 20px -6px rgba(63, 122, 31, 0.45);
    }
    h1 {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 26px;
      line-height: 1.2;
      margin-bottom: 12px;
    }
    p {
      font-size: 15.5px;
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 26px;
    }
    .stars { color: var(--gold); font-size: 18px; letter-spacing: 2px; margin-bottom: 18px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: var(--ink);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      padding: 16px 20px;
      border-radius: 16px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 10px 24px -10px rgba(28, 36, 19, 0.5);
    }
    .btn:active { transform: scale(0.98); }
    .btn svg { width: 20px; height: 20px; }
    .hint {
      margin-top: 20px;
      font-size: 13px;
      color: #9aa48d;
    }
    .brand { color: var(--green-deep); font-weight: 600; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/logo.png" alt="Eats AI" />
    <div class="stars">&#9733; &#9733; &#9733; &#9733; &#9733;</div>
    <h1>Open Eats AI to finish</h1>
    <p>
      If you have <span class="brand">Eats AI</span> installed, it will open automatically to
      complete your TikTok sign in. Do not have the app yet? Get it below.
    </p>
    <a class="btn" href="https://apps.apple.com/app/id6759102367" id="storeBtn">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.365 1.43c0 1.14-.42 2.2-1.12 2.99-.85.95-2.24 1.68-3.4 1.59-.14-1.11.42-2.29 1.09-3.02.76-.84 2.15-1.51 3.43-1.56zM20.9 17.02c-.56 1.3-.83 1.88-1.55 3.03-1.01 1.6-2.43 3.59-4.19 3.6-1.57.02-1.97-1.02-4.1-1.01-2.13.01-2.57 1.03-4.14 1.01-1.76-.02-3.11-1.82-4.12-3.42C-.02 17.3-.3 12.28 1.5 9.62c.99-1.47 2.55-2.4 4.03-2.4 1.5 0 2.45 1.02 3.69 1.02 1.21 0 1.95-1.02 3.69-1.02 1.31 0 2.7.71 3.69 1.94-3.24 1.77-2.71 6.39.3 7.86z"/></svg>
      Download on the App Store
    </a>
    <p class="hint">You can safely close this tab after the app opens.</p>
  </main>
</body>
</html>
